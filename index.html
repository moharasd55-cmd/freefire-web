<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle Zone</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}

body {
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, #4c8c3c 0%, #28552b 45%, #172d20 100%);
}

/* الأرض */
#ground {
  position: absolute;
  width: 1600px;
  height: 1200px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background-color: #3d7a38;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255,255,255,.04) 25%, transparent 25%);
  background-size: 80px 80px;
}

/* اللاعب */
#player {
  position: absolute;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1976d2;
  border: 4px solid white;
  box-shadow: 0 0 15px #000;
  z-index: 10;
}

#player::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 25px;
  background: #222;
  right: -17px;
  top: 7px;
  border-radius: 5px;
}

/* الأعداء */
.enemy {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #d32f2f;
  border: 3px solid #fff;
  box-shadow: 0 0 12px #700;
}

/* الأشجار */
.tree {
  position: absolute;
  width: 70px;
  height: 100px;
}

.tree::before {
  content: "";
  position: absolute;
  width: 35px;
  height: 65px;
  background: #68452a;
  left: 18px;
  top: 35px;
}

.tree::after {
  content: "";
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #164d25;
  top: 0;
  left: 0;
  box-shadow: 20px 15px 0 #216b2c;
}

/* واجهة */
#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 50;
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 2px 2px 4px #000;
}

#health {
  background: rgba(0,0,0,.6);
  padding: 10px 15px;
  border-radius: 12px;
}

#score {
  background: rgba(0,0,0,.6);
  padding: 10px 15px;
  border-radius: 12px;
}

/* عصا التحكم */
#joystick {
  position: fixed;
  bottom: 35px;
  left: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: 3px solid rgba(255,255,255,.4);
  z-index: 100;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  background: rgba(255,255,255,.7);
  border-radius: 50%;
  left: 37px;
  top: 37px;
}

/* زر إطلاق */
#shoot {
  position: fixed;
  right: 30px;
  bottom: 45px;
  width: 95px;
  height: 95px;
  border-radius: 50%;
  border: 4px solid white;
  background: #d62828;
  color: white;
  font-size: 20px;
  font-weight: bold;
  z-index: 100;
}

/* شاشة البداية والنهاية */
#menu {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.82);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  text-align: center;
}

#menu h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

#menu p {
  margin-bottom: 25px;
  font-size: 18px;
}

#start {
  padding: 15px 45px;
  border: 0;
  border-radius: 12px;
  background: #ff9800;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.bullet {
  position: absolute;
  width: 10px;
  height: 10px;
  background: yellow;
  border-radius: 50%;
  z-index: 20;
}
</style>
</head>

<body>

<div id="game">
  <div id="ground"></div>

  <div id="player"></div>

  <div id="hud">
    <div id="health">❤️ 100</div>
    <div id="score">🏆 0</div>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shoot">🔫 إطلاق</button>

  <div id="menu">
    <h1>⚔️ BATTLE ZONE</h1>
    <p>قاتل الأعداء واجمع أكبر عدد من النقاط!</p>
    <button id="start">ابدأ اللعب 🎮</button>
  </div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const healthText = document.getElementById("health");
const menu = document.getElementById("menu");
const start = document.getElementById("start");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const shoot = document.getElementById("shoot");

let x = innerWidth / 2;
let y = innerHeight / 2;
let health = 100;
let score = 0;
let running = false;

let dx = 0;
let dy = 0;

const enemies = [];

function updatePlayer() {
  if (!running) return;

  x += dx * 4;
  y += dy * 4;

  x = Math.max(25, Math.min(innerWidth - 25, x));
  y = Math.max(25, Math.min(innerHeight - 25, y));

  player.style.left = (x - 22) + "px";
  player.style.top = (y - 22) + "px";

  requestAnimationFrame(updatePlayer);
}

function createEnemy() {
  if (!running) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  enemy.style.left = Math.random() * (innerWidth - 50) + "px";
  enemy.style.top = Math.random() * (innerHeight - 120) + "px";

  game.appendChild(enemy);
  enemies.push(enemy);
}

function moveEnemies() {
  if (!running) return;

  enemies.forEach((enemy, index) => {
    let ex = parseFloat(enemy.style.left);
    let ey = parseFloat(enemy.style.top);

    const px = x;
    const py = y;

    const vx = px - ex;
    const vy = py - ey;
    const distance = Math.sqrt(vx * vx + vy * vy);

    if (distance > 50) {
      ex += vx / distance * 0.7;
      ey += vy / distance * 0.7;

      enemy.style.left = ex + "px";
      enemy.style.top = ey + "px";
    } else {
      health -= 0.2;
      healthText.textContent = "❤️ " + Math.max(0, Math.floor(health));

      if (health <= 0) {
        gameOver();
      }
    }
  });

  requestAnimationFrame(moveEnemies);
}

function shootEnemy() {
  if (!running) return;

  let nearest = null;
  let nearestDistance = Infinity;

  enemies.forEach(enemy => {
    const ex = parseFloat(enemy.style.left) + 21;
    const ey = parseFloat(enemy.style.top) + 21;

    const d = Math.hypot(ex - x, ey - y);

    if (d < nearestDistance) {
      nearestDistance = d;
      nearest = enemy;
    }
  });

  if (nearest && nearestDistance < 350) {
    nearest.remove();

    const index = enemies.indexOf(nearest);
    if (index !== -1) enemies.splice(index, 1);

    score += 10;
    scoreText.textContent = "🏆 " + score;
  }
}

function gameOver() {
  running = false;
  menu.style.display = "flex";

  menu.querySelector("h1").textContent = "💀 انتهت اللعبة";
  menu.querySelector("p").textContent =
    "نقاطك: " + score + " 🏆";

  start.textContent = "إعادة اللعب 🔄";
}

start.onclick = () => {
  health = 100;
  score = 0;

  healthText.textContent = "❤️ 100";
  scoreText.textContent = "🏆 0";

  enemies.forEach(e => e.remove());
  enemies.length = 0;

  menu.style.display = "none";
  running = true;

  x = innerWidth / 2;
  y = innerHeight / 2;

  updatePlayer();
  moveEnemies();

  for (let i = 0; i < 6; i++) {
    createEnemy();
  }
};

shoot.addEventListener("touchstart", e => {
  e.preventDefault();
  shootEnemy();
});

shoot.addEventListener("click", shootEnemy);

/* التحكم باللمس */
let active = false;

joystick.addEventListener("touchstart", e => {
  active = true;
});

joystick.addEventListener("touchmove", e => {
  if (!active) return;

  const touch = e.touches[0];
  const rect = joystick.getBoundingClientRect();

  let cx = rect.left + rect.width / 2;
  let cy = rect.top + rect.height / 2;

  let vx = touch.clientX - cx;
  let vy = touch.clientY - cy;

  const max = 45;
  const dist = Math.hypot(vx, vy);

  if (dist > max) {
    vx = vx / dist * max;
    vy = vy / dist * max;
  }

  stick.style.left = (37 + vx) + "px";
  stick.style.top = (37 + vy) + "px";

  dx = vx / max;
  dy = vy / max;
});

joystick.addEventListener("touchend", () => {
  active = false;
  dx = 0;
  dy = 0;

  stick.style.left = "37px";
  stick.style.top = "37px";
});

/* أشجار */
for (let i = 0; i < 12; i++) {
  const tree = document.createElement("div");
  tree.className = "tree";
  tree.style.left = Math.random() * (innerWidth - 80) + "px";
  tree.style.top = Math.random() * (innerHeight - 130) + "px";
  game.appendChild(tree);
}
</script>

</body>
  </html>
